<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Task Manager</h1>
    <div class="input-area">
      <input
        type="text"
        id="taskInput"
        placeholder="Enter a new task..."
        autocomplete="off"
      />
      <select id="categorySelect" aria-label="Select category">
        <option value="Work">Work</option>
        <option value="Personal">Personal</option>
        <option value="Shopping">Shopping</option>
      </select>
      <button id="addTaskBtn">Add Task</button>
    </div>
    <div class="filter-area">
      <span class="filter-label">Filter:</span>
      <button class="filter-btn active" data-filter="All">All</button>
      <button class="filter-btn" data-filter="Work">Work</button>
      <button class="filter-btn" data-filter="Personal">Personal</button>
      <button class="filter-btn" data-filter="Shopping">Shopping</button>
    </div>
    <ul id="taskList"></ul>
    <p id="emptyMessage" class="empty-message">No tasks yet. Add one above!</p>
  </div>
  <script src="app.js"></script>
</body>
</html>
